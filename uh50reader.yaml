esphome:
  name: esp-uh50reader
  friendly_name: UH50 Heat Meter

esp8266:
  board: nodemcu

external_components:
  - source:
      type: local
      path: components
    components: [uh50]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "esp-uh50reader"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret encryption_key
  custom_services: true

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
  baud_rate: 0 # disable logging over uart

# The new implementation uses a single UART bus and dynamically changes baud rate.
uart:
  - id: uart_bus
    rx_pin: RX
    tx_pin: TX
    baud_rate: 300
    data_bits: 7
    parity: EVEN
    stop_bits: 2
    rx_buffer_size: 4000

uh50:
  id: uh50_reader
  uart_id: uart_bus

sensor:
  - platform: uh50
    uh50_id: uh50_reader
    cumulative_active_import:
      name: "UH50 Cumulative Active Import"
    cumulative_volume:
      name: "UH50 Cumulative Volume"
    current_power:
      name: "UH50 Current Power"
    flow_rate:
      name: "UH50 Flow Rate"
    temperature_flow:
      name: "UH50 Flow Temperature"
    temperature_return:
      name: "UH50 Return Temperature"
    temperature_diff:
      name: "UH50 Diff Temperature"
    operating_hours:
      name: "UH50 Operating Hours"
    max_power_period:
      name: "UH50 Max Power Period"
    max_flow_period:
      name: "UH50 Max Flow Period"
    max_temp_flow_period:
      name: "UH50 Max Flow Temperature Period"
    max_temp_return_period:
      name: "UH50 Max Return Temperature Period"
    prev_month_energy:
      name: "UH50 Previous Month Energy"
    prev_month_volume:
      name: "UH50 Previous Month Volume"
    error_code:
      name: "UH50 Error Code"
      entity_category: "diagnostic"

button:
  - platform: template
    name: "UH50 Trigger Read"
    id: btn_read_meter
    icon: "mdi:refresh"
    on_press:
      - lambda: |-
          id(uh50_reader).trigger_read();
