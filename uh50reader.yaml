esphome:
  name: esp-uh50reader

esp8266:
  # board d1_mini also works (wemos d1 mini)
  board: nodemcu

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "esp-uh50reader"
    password: !secret fallback_password

captive_portal:

# Uncomment the following 2 lines to enable web-access to the device to view logs and update firmware
#web_server:
#  port: 80

# Enable logging
logger:
  level: DEBUG
  baud_rate: 0 # disable logging over uart

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# The protocol requires outgoing communication (TX) at 300 baud and incoming
# communication (RX) at 2400 baud, so both hardware UARTs of the ESP8266 are used.
uart:
  - id: uart_in
    rx_pin: RX
    baud_rate: 2400
    data_bits: 7
    parity: EVEN
    stop_bits: 2
    rx_buffer_size: 2048
  - id: uart_out
    tx_pin: D4
    baud_rate: 300
    data_bits: 7
    parity: EVEN
    stop_bits: 2

external_components:
  - source: github://psvanstrom/esphome-uh50reader@main
    components: [uh50]

sensor:
  - platform: uh50
    uart_id: uart_in
    uart_out_id: uart_out
    # The meter is (usually) battery powered, so read it sparingly.
    update_interval: 30min
    # Optional on-demand read, exposed to Home Assistant as a button.
    read_button:
      name: "UH50 Read Meter"
    cumulative_energy:
      name: "UH50 Cumulative Active Import"
    cumulative_volume:
      name: "UH50 Cumulative Volume"
    current_power:
      name: "UH50 Current Power"
    flow_rate:
      name: "UH50 Flow Rate"
    flow_temp:
      name: "UH50 Flow Temperature"
    return_temp:
      name: "UH50 Return Temperature"
    diff_temp:
      name: "UH50 Diff Temperature"
